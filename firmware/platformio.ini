; LoRaITP firmware builds.
;
;   pio run -e heltec_v3 -t upload
;   pio run -e xiao_esp32s3_sense -t upload
;
; Four targets, one radio driver. The core in ../src is plain C99 and is
; compiled unchanged for every environment; only the pin map differs.
;
; NOT YET BUILT AGAINST A REAL TOOLCHAIN. The adapter compiles and passes
; a contract test against tests/mock/, but nobody has run PlatformIO on
; this file yet, and the XIAO pin maps still hold placeholders. Expect to
; fix things on the first run - see firmware/boards/README.md.

[platformio]
src_dir = app
default_envs = heltec_v3

[common]
build_flags =
    -I../src
    -I../port
    -Iboards
    -DLORAITP_STORE_DIR='"/images"' 
    -DLORAITP_ENABLE_FEC=1
    -DLORAITP_ENABLE_MAC=1
build_src_filter =
    +<*>
    +<../../src/*.c>
    +<../../port/port_radiolib.cpp>
    +<../../port/loraitp_store.c>
lib_deps =
    jgromes/RadioLib@^7.1.0
    ; LittleFS, WiFi, WebServer and Preferences ship with the ESP32
    ; Arduino core. The nRF52 build has none of them and needs its own
    ; filesystem on the QSPI flash instead.
monitor_speed = 115200

; ---------------------------------------------------------------- ESP32

[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.partitions = partitions_8mb.csv
build_flags = ${common.build_flags} -DLORAITP_BOARD_HELTEC_V3
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

[env:heltec_v4]
platform = espressif32
; PlatformIO may not carry a V4 board definition yet. The V4 keeps the V3
; form factor, so the V3 definition is the starting point - but it has
; 16 MB of flash and 2 MB of PSRAM, hence the overrides below.
board = heltec_wifi_lora_32_V3
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
build_flags =
    ${common.build_flags}
    -DLORAITP_BOARD_HELTEC_V4
    -DBOARD_HAS_PSRAM
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions_8mb.csv
build_flags =
    ${common.build_flags}
    -DLORAITP_BOARD_XIAO_ESP32S3_SENSE
    -DBOARD_HAS_PSRAM
    -DLORAITP_HAS_CAMERA=1
build_src_filter = ${common.build_src_filter}
lib_deps =
    ${common.lib_deps}
    espressif/esp32-camera@^2.0.4
monitor_speed = ${common.monitor_speed}

; The cheap base station: a plain XIAO with the Kit radio on the B2B
; connector. No camera - the radio is in its slot - which is exactly right
; at the receiving end, and costs a good deal less than a Heltec.

[env:xiao_esp32s3_kit]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions_8mb.csv
build_flags =
    ${common.build_flags}
    -DLORAITP_BOARD_XIAO_ESP32S3_KIT
    -DBOARD_HAS_PSRAM
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

; ------------------------------------------------------------- nRF52840
;
; DOES NOT BUILD YET, and not for a reason a few #ifdefs would fix.
;
; The protocol core and the RadioLib port are plain C99/C++ and compile
; for this part unchanged - that was the point of the port boundary, and
; firmware/boards/xiao_nrf52840.h is checked by tests/test_boards.cpp.
;
; What does not port is the *application*. It is built on LittleFS, NVS
; and an HTTP server over WiFi, and the nRF52840 has none of those - no
; WiFi at all. A web interface is not something to be conditionally
; compiled out here; it is meaningless on a board that cannot serve one.
; This target needs its own application: images off over USB or BLE,
; settings somewhere other than NVS, storage on the 2 MB QSPI flash.
;
; Left here so the intent is on record rather than pretending four
; targets work when three do. It is excluded from CI for the same reason.
;
; The board id below is from Seeed's own platform; the community
; nordicnrf52 fork calls it xiaoblesense instead.

[env:xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
build_flags = ${common.build_flags} -DLORAITP_BOARD_XIAO_NRF52840
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}

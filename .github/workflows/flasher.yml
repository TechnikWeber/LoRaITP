name: web flasher

# Builds every target and publishes docs/ to GitHub Pages, so the flasher
# page always offers binaries that match a commit rather than whatever was
# uploaded by hand last.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install platformio

      - name: manifests match the partition tables
        run: python3 tools/check_flash_manifest.py

      - name: build every target
        working-directory: firmware
        run: |
          for e in heltec_v3 heltec_v4 xiao_esp32s3_sense xiao_esp32s3_kit; do
            pio run -e "$e"
          done

      - name: collect binaries
        run: |
          for e in heltec_v3 heltec_v4 xiao_esp32s3_sense xiao_esp32s3_kit; do
            mkdir -p "docs/flash/$e"
            b="firmware/.pio/build/$e"
            cp "$b/firmware.bin" "$b/bootloader.bin" "$b/partitions.bin" \
               "docs/flash/$e/"
            # boot_app0 lives in the framework package, not the build dir.
            find ~/.platformio -name boot_app0.bin | head -1 \
              | xargs -I{} cp {} "docs/flash/$e/"
          done
          sed -i "s|the main branch|${GITHUB_SHA::7}|" docs/flash/index.html

      # One merged image per board for flashing without the web page (Firefox, offline:
      # esptool write-flash 0x0 <file>). The offsets come from the flasher manifests,
      # which tools/check_flash_manifest.py has just checked against the partition tables.
      - name: merged images for the release
        run: |
          pip install "esptool>=4.8,<6"
          v=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || v=${GITHUB_SHA::7}
          mkdir -p release
          for e in heltec_v3 heltec_v4 xiao_esp32s3_sense xiao_esp32s3_kit; do
            args=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(" ".join(f"{hex(p["offset"])} docs/flash/{p["path"]}" for p in m["builds"][0]["parts"]))' "docs/flash/manifest-$e.json")
            python3 -m esptool --chip esp32s3 merge_bin -o "release/loraitp-$v-$e.bin" $args
          done
          cd release && sha256sum *.bin > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: loraitp-firmware
          path: release/*

      - uses: actions/upload-pages-artifact@v5
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: loraitp-firmware, path: release }
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Flash from the browser: https://technikweber.github.io/LoRaITP/flash/ — or, without it: esptool write-flash 0x0 loraitp-<version>-<board>.bin" \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" release/* --clobber
